name: Publications isolated validation

on:
  pull_request:
    paths:
      - "lib/publications/**"
      - "lib/integrations/publications-*"
      - "lib/integrations/publications-oauth/**"
      - "components/publications/**"
      - "components/clients/client-publications-panel.tsx"
      - "app/(cockpit)/publications/**"
      - "app/api/publications/**"
      - "supabase/migrations/**"
      - "supabase/tests/publications*"
      - "supabase/local/remote-schema.sql"
      - "tests/publications*"
      - "tests/helpers/local-postgres.mjs"
      - "scripts/test-publications-native.mjs"
      - "scripts/test-publications-ui.mjs"
      - "e2e/harness/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publications-isolated.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publications-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publications:
    name: Publications PostgreSQL and browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: codev_local_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install PostgreSQL client and isolated Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          npx --no-install playwright install --with-deps chromium
      - name: Native Publications transactions and concurrency
        run: node scripts/test-publications-native.mjs
        env:
          PUBLICATIONS_TEST_DATABASE_URL: postgres://postgres:codev_local_test_only@127.0.0.1:5432/publications_lot1_test
          PUBLICATIONS_TEST_PSQL: psql
      - name: Native SQL desktop and mobile publication workflow
        run: node scripts/test-publications-ui.mjs --download-postgrest
        env:
          E2E_DATABASE_URL: postgres://postgres:codev_local_test_only@127.0.0.1:5432/codev_publications_ui
          CODEV_CORE_TEST_PSQL: psql
          NODE_USE_ENV_PROXY: "0"
          NEXT_TELEMETRY_DISABLED: "1"
