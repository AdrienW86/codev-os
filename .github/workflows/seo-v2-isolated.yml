# Disposable PostgreSQL 17: never connects to the Supabase production project.
name: SEO V2 isolated SQL validation

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/seo-opportunities.sql"
      - "supabase/local/remote-schema.sql"
      - "supabase/local/seo-v2-live-dependencies-20261015.sql"
      - "tests/seo-opportunities-db.test.mjs"
      - "tests/seo-v2-live-contract-db.test.mjs"
      - "lib/scheduler/engine.ts"
      - "tests/scoped-claim-db.test.mjs"
      - "tests/supabase-migration-versions.test.mjs"
      - "tests/helpers/local-postgres.mjs"
      - ".github/workflows/seo-v2-isolated.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-migration:
    name: PostgreSQL 17 isolated replay and SQL checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: codev_local_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests reject any non-loopback host and any non-test database name.
      CODEV_CORE_TEST_DATABASE_URL: postgres://postgres:codev_local_test_only@127.0.0.1:5432/codev_core_test
      PGCONNECT_TIMEOUT: "5"
    steps:
      - name: Checkout migration sources
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PostgreSQL client only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql --version
      - name: Validate migration names
        run: node --test tests/supabase-migration-versions.test.mjs
      - name: Replay schema and migrations on disposable database, run SQL tests
        run: node --test tests/seo-opportunities-db.test.mjs
      - name: Replay against production-derived dependency contract and verify service role
        run: node --test tests/seo-v2-live-contract-db.test.mjs
      - name: Native scoped job claims (no production connection)
        run: node --test tests/scoped-claim-db.test.mjs
        env:
          CODEV_SCOPED_TEST_DATABASE_URL: postgres://postgres:codev_local_test_only@127.0.0.1:5432/codev_core_test_scoped_jobs
