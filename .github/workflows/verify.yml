name: CODE-V OS verification
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: codev-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node version
        run: node --version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Tests
        run: npm test
      - name: Lint
        if: always()
        run: npm run lint
      - name: TypeScript
        if: always()
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install isolated test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Director desktop and mobile (simulated data)
        run: node scripts/test-director-ui.mjs
        env:
          NODE_USE_ENV_PROXY: "0"
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Automation supervision desktop and mobile (simulated data)
        run: node scripts/test-automation-ui.mjs
        env:
          NODE_USE_ENV_PROXY: "0"
          NEXT_TELEMETRY_DISABLED: "1"
