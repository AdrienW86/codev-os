name: CODE-V Visual Factory - images vers Google Drive

on:
  pull_request:
    paths:
      - "scripts/visual-factory/**"
      - ".github/workflows/visual-factory.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Audit Vercel uniquement (aucune génération payante)"
        type: boolean
        default: true
        required: true
      site:
        description: "Filtrer un projet Vercel (optionnel)"
        type: string
        required: false
      max_images:
        description: "Limiter encore les images créées (optionnel)"
        type: string
        required: false
  schedule:
    - cron: "0 8 * * 6" # Chaque samedi, 08:00 UTC (09:00 hiver / 10:00 été, Paris)

permissions:
  contents: read

concurrency:
  group: codev-visual-factory
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test scripts/visual-factory/generate.test.mjs

  generate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.VISUAL_FACTORY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check agent and file naming
        run: node --test scripts/visual-factory/generate.test.mjs
      - name: Discover Vercel sites and optionally produce images
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          OPENAI_API_KEY: ${{ secrets.VISUAL_OPENAI_API_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.VISUAL_GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.VISUAL_GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.VISUAL_GOOGLE_DRIVE_REFRESH_TOKEN }}
          VISUAL_MAX_IMAGES: ${{ vars.VISUAL_MAX_IMAGES || '480' }}
          VISUAL_MAX_OUTPUT_USD: ${{ vars.VISUAL_MAX_OUTPUT_USD || '21' }}
          VISUAL_IMAGE_MODEL: "gpt-image-2"
          VISUAL_DRIVE_ROOT_ID: "15JDPgR7R5uF9Re59tkwT2b59zMC2E3w2"
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          SITE_INPUT: ${{ inputs.site }}
          MAX_IMAGES_INPUT: ${{ inputs.max_images }}
        run: |
          args=()
          if [ "$DRY_RUN_INPUT" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$SITE_INPUT" ]; then args+=("--site=$SITE_INPUT"); fi
          if [ -n "$MAX_IMAGES_INPUT" ]; then args+=("--max-images=$MAX_IMAGES_INPUT"); fi
          node scripts/visual-factory/generate.mjs "${args[@]}"
      - name: Archive audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-factory-report
          path: visual-factory-report.json
          if-no-files-found: warn
          retention-days: 30
